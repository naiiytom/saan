[package]
name = "saan_script"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Embedded Rhai scripting engine for gameplay logic, unit AI, and scenario triggers in Saan"

[dependencies]
glam = { version = "0.29", features = ["serde"] }
rhai = { version = "1.20", default-features = false, features = ["sync", "serde", "internals"] }
saan_core = { path = "../saan_core" }
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"
