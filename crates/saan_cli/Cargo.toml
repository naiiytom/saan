[package]
name = "saan_cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The Craft Station: CLI toolbelt for the Saan 2.5D & 3D game engine"

[[bin]]
name = "saan"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
saan_core = { path = "../saan_core" }
saan_render = { path = "../saan_render" }
saan_spatial = { path = "../saan_spatial" }
serde_json = "1.0"
