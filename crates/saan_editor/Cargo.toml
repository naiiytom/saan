[package]
name = "saan_editor"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The Craft Loom Editor: Interactive Diorama Editor with Hierarchy, Strand Inspector, Tile Brush, and .saan Serializer"

[dependencies]
anyhow = "1.0"
glam = { version = "0.29", features = ["serde"] }
saan_asset = { path = "../saan_asset" }
saan_audio = { path = "../saan_audio" }
saan_core = { path = "../saan_core" }
saan_render = { path = "../saan_render" }
saan_script = { path = "../saan_script" }
saan_spatial = { path = "../saan_spatial" }
serde = { version = "1.0", features = ["derive"] }
winit = "0.30"
